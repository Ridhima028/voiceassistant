version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: voicepilot

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d voicepilot" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: voicepilot-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend:/app

volumes:
  postgres-data:
